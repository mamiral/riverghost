# Default bonus payout configurations for GTO solver
# These represent common tournament bonus multipliers

bonus_payouts:
  royal_flush: 500
  straight_flush: 100
  four_of_a_kind: 50
  full_house: 10
  flush: 5
  straight: 4
  three_of_a_kind: 3
  two_pair: 2
  one_pair: 1

aof_browser_runtime:
  num_simulations: 120
  combo_samples: 4
  timeout_ms: 900
  seed: 42
  precompute_max_workers: 3

aof_browser_cache:
  enabled: true
  db_path: "python/hopilot/cache/aof_scenario_cache.sqlite3"
  schema_version: "1"
  policy_signature: "aof-cache-policy-v1"