# Default bonus payout configurations for GTO solver
# These represent common tournament bonus multipliers

bonus_payouts:
  royal_flush: 500
  straight_flush: 100
  four_of_a_kind: 50
  full_house: 10
  flush: 5
  straight: 4
  three_of_a_kind: 3
  two_pair: 2
  one_pair: 1

aof_browser_runtime:
  num_simulations: 1000
  combo_samples: 4
  timeout_ms: 900
  seed: 42
  precompute_max_workers: 3
  convergence_target_points: 8

database:
  url: "sqlite:///python/hopilot/data/normalized_poker.db"
  path: "python/hopilot/data/normalized_poker.db"
  connection_pool_size: 5
  pool_timeout: 30.0
  timeout_ms: 500
  enable_migration: true
  schema_version: "1.0"