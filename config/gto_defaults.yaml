# Default bonus payout configurations for GTO solver
# These represent common tournament bonus multipliers

bonus_payouts:
  royal_flush: 500
  straight_flush: 100
  four_of_a_kind: 50
  full_house: 10
  flush: 5
  straight: 4
  three_of_a_kind: 3
  two_pair: 2
  one_pair: 1

aof_browser_runtime:
  num_simulations: 1000
  combo_samples: 4
  timeout_ms: 900
  seed: 42
  precompute_max_workers: 3
  convergence_target_points: 8

aof_browser_cache:
  enabled: true
  db_path: "python/hopilot/cache/aof_scenario_cache.sqlite3"
  schema_version: "1"
  policy_signature: "aof-cache-policy-v1"
  persist_degraded_payloads: true

aggregation:
  enabled: false  # Feature flag for backward-safe rollout
  migration_mode: "coexistence"  # coexistence or migration
  db_path: "python/hopilot/cache/aof_aggregation_cache.sqlite3"

database:
  path: "python/hopilot/data/normalized_poker.db"
  connection_pool_size: 5
  timeout_ms: 500
  enable_migration: true
  schema_version: "1.0"